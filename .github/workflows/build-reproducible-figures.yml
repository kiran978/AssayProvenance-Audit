name: Regenerate evidence plots from deposited source tables
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/regenerate_evidence_figures.py'
      - '.github/workflows/build-reproducible-figures.yml'
permissions:
  contents: write
concurrency:
  group: assayprovenance-evidence-figures
  cancel-in-progress: false
jobs:
  build-evidence-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-figures.txt
      - name: Install plotting environment
        run: python -m pip install -r requirements-figures.txt
      - name: Check source counts first
        run: python scripts/verify_public_evidence.py
      - name: Generate evidence-derived PNG and SVG figures
        run: python scripts/regenerate_evidence_figures.py
      - name: Check 8 plots × 2 formats
        run: |
          test "$(find figures/reproducible/ -name '*.png' | wc -l)" -eq 8
          test "$(find figures/reproducible/ -name '*.svg' | wc -l)" -eq 8
      - name: Commit generated reproducible artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/reproducible/
          if ! git diff --cached --quiet; then
            git commit -m "Add eight independent-source evidence plots as PNG and SVG"
            git push
          fi
