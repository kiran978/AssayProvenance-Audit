name: R1 PubChem source recovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/R1_43pair_stage4_source_registry.csv'
      - 'data/R1_71_aid_retrieval_manifest.csv'
      - '.github/workflows/pubchem-r1.yml'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pair registry and PubChem manifest
        run: python src/validate_R1_evidence.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  recover:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download original PubChem assay descriptions
        run: python src/fetch_pubchem_assay_descriptions.py --delay 0.5
      - name: Save source retrieval records, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R1-PubChem-primary-source-retrieval
          path: raw_pubchem/
          if-no-files-found: warn
          retention-days: 30
